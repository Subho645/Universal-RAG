<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal RAG</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f5f5f3;
    --surface:  #ffffff;
    --border:   #e0ddd6;
    --text:     #1a1a18;
    --muted:    #6b6b66;
    --accent:   #2563eb;
    --accent-h: #1d4ed8;
    --success:  #16a34a;
    --error:    #dc2626;
    --radius:   10px;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  .container { width: 100%; max-width: 780px; }

  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: .25rem; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 2rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }

  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

  /* Status bar */
  .status-bar {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: .82rem;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.green { background: var(--success); }
  .dot.red   { background: var(--error); }

  /* Drop zone */
  #drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    color: var(--muted);
    font-size: .9rem;
  }
  #drop-zone.drag-over {
    border-color: var(--accent);
    background: #eff6ff;
  }
  #drop-zone input { display: none; }
  #drop-zone strong { display: block; color: var(--text); margin-bottom: .25rem; font-size: 1rem; }

  .file-list { margin-top: .75rem; text-align: left; }
  .file-tag {
    display: inline-flex; align-items: center; gap: .35rem;
    background: #f0f0ec; border: 1px solid var(--border);
    border-radius: 6px; padding: .2rem .55rem;
    font-size: .8rem; margin: .2rem .2rem 0 0;
  }

  /* Buttons */
  .btn {
    display: inline-block;
    padding: .55rem 1.25rem;
    border-radius: 8px;
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: background .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-danger { background: #fee2e2; color: var(--error); }
  .btn-danger:hover { background: #fecaca; }

  .btn-row { display: flex; gap: .75rem; margin-top: 1rem; flex-wrap: wrap; }

  /* Query */
  .query-row { display: flex; gap: .5rem; }
  #question {
    flex: 1;
    padding: .6rem .85rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    outline: none;
    transition: border-color .15s;
  }
  #question:focus { border-color: var(--accent); }

  /* Answer */
  #answer-box { display: none; }
  .answer-text {
    font-size: .95rem;
    line-height: 1.7;
    white-space: pre-wrap;
    color: var(--text);
    margin-bottom: 1rem;
  }
  .sources { font-size: .8rem; color: var(--muted); }
  .source-tag {
    display: inline-block;
    background: #f0f0ec;
    border-radius: 5px;
    padding: .15rem .45rem;
    margin: .1rem;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    padding: .75rem 1.25rem;
    border-radius: 8px;
    font-size: .875rem;
    color: #fff;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    z-index: 99;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.success { background: var(--success); }
  .toast.error   { background: var(--error); }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid #ffffff55;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sep { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
</style>
</head>
<body>
<div class="container">

  <h1>Universal RAG</h1>
  <p class="subtitle">Upload any document — PDF, DOCX, TXT, CSV, XLSX, JSON, HTML, Markdown — and ask questions.</p>

  <!-- Status -->
  <div class="status-bar" id="status-bar">
    <span id="ollama-status"><span class="dot red"></span>Checking Ollama...</span>
    <span id="db-status"></span>
  </div>

  <!-- Upload -->
  <div class="card">
    <h2>1. Upload documents</h2>
    <div id="drop-zone">
      <input type="file" id="file-input" multiple
        accept=".txt,.pdf,.docx,.doc,.csv,.xlsx,.xls,.json,.html,.htm,.md,.markdown">
      <strong>Drop files here or click to browse</strong>
      Supported: PDF, DOCX, TXT, CSV, XLSX, JSON, HTML, Markdown
    </div>
    <div class="file-list" id="file-list"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="ingest-btn" disabled>Ingest documents</button>
      <button class="btn btn-danger" id="reset-btn">Reset database</button>
    </div>
    <div id="ingest-msg" style="margin-top:.75rem;font-size:.85rem;color:var(--muted)"></div>
  </div>

  <!-- Query -->
  <div class="card">
    <h2>2. Ask a question</h2>
    <div class="query-row">
      <input type="text" id="question" placeholder="e.g. What is BASUDEB SANYAL's posting?" />
      <button class="btn btn-primary" id="ask-btn">Ask</button>
    </div>
  </div>

  <!-- Answer -->
  <div class="card" id="answer-box">
    <h2>Answer</h2>
    <div class="answer-text" id="answer-text"></div>
    <hr class="sep">
    <div class="sources" id="sources-text"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let selectedFiles = [];

// ── Status check ──────────────────────────────
async function checkStatus() {
  try {
    const r = await fetch('/status');
    const d = await r.json();
    $('ollama-status').innerHTML = d.ollama_running
      ? `<span class="dot green"></span>Ollama running`
      : `<span class="dot red"></span>Ollama not running`;
    $('db-status').innerHTML = d.db_exists
      ? `<span class="dot green"></span>Database ready`
      : `<span class="dot red"></span>No database yet`;
  } catch {
    $('ollama-status').innerHTML = `<span class="dot red"></span>Cannot reach server`;
  }
}
checkStatus();

// ── Drop zone ─────────────────────────────────
const dz = $('drop-zone');
const fi = $('file-input');

dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  addFiles([...e.dataTransfer.files]);
});
fi.addEventListener('change', () => addFiles([...fi.files]));

function addFiles(files) {
  for (const f of files) {
    if (!selectedFiles.find(x => x.name === f.name)) selectedFiles.push(f);
  }
  renderFileList();
}

function renderFileList() {
  const list = $('file-list');
  list.innerHTML = selectedFiles.map(f =>
    `<span class="file-tag">📄 ${f.name}</span>`
  ).join('');
  $('ingest-btn').disabled = selectedFiles.length === 0;
}

// ── Ingest ────────────────────────────────────
$('ingest-btn').addEventListener('click', async () => {
  if (!selectedFiles.length) return;
  const btn = $('ingest-btn');
  const msg = $('ingest-msg');
  btn.innerHTML = '<span class="spinner"></span>Ingesting...';
  btn.disabled = true;

  const fd = new FormData();
  selectedFiles.forEach(f => fd.append('files', f));

  try {
    const r = await fetch('/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Upload failed');
    msg.textContent = `✓ Ingested: ${d.ingested.join(', ')}` + (d.skipped.length ? ` | Skipped: ${d.skipped.join(', ')}` : '');
    showToast('Documents ingested successfully', 'success');
    selectedFiles = [];
    renderFileList();
    checkStatus();
  } catch (e) {
    msg.textContent = '✗ ' + e.message;
    showToast(e.message, 'error');
  } finally {
    btn.textContent = 'Ingest documents';
    btn.disabled = false;
  }
});

// ── Reset ─────────────────────────────────────
$('reset-btn').addEventListener('click', async () => {
  if (!confirm('Reset the database and delete all uploaded files?')) return;
  await fetch('/reset', { method: 'DELETE' });
  $('answer-box').style.display = 'none';
  $('ingest-msg').textContent = '';
  showToast('Database reset', 'success');
  checkStatus();
});

// ── Query ─────────────────────────────────────
async function askQuestion() {
  const q = $('question').value.trim();
  if (!q) return;
  const btn = $('ask-btn');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Query failed');

    $('answer-text').textContent = d.answer;
    $('sources-text').innerHTML = 'Sources: ' + d.sources.map(s =>
      `<span class="source-tag">${s.source} (${s.score})</span>`
    ).join('');
    $('answer-box').style.display = 'block';
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.textContent = 'Ask';
    btn.disabled = false;
  }
}

$('ask-btn').addEventListener('click', askQuestion);
$('question').addEventListener('keydown', e => { if (e.key === 'Enter') askQuestion(); });

// ── Toast ─────────────────────────────────────
function showToast(msg, type = 'success') {
  const t = $('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
