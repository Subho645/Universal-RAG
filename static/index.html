<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask your documents</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.thread{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}
.empty h1{color:var(--ink)}
.msg{max-width:88%;padding:12px 16px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot.err{border-color:var(--bad);color:var(--bad)}
.src{margin-top:10px;font-size:12.5px;color:var(--muted);white-space:normal}
.chip{display:inline-block;background:var(--soft);border-radius:6px;padding:2px 8px;margin:4px 4px 0 0}
.composer{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;display:flex;gap:10px}
</style></head><body>
<nav class="nav">
  <span class="brand">Universal RAG</span>
  <a class="on" href="/">Ask</a>
  <a href="/admin">Manage documents</a>
  <span class="status"><i class="dot" id="dot"></i><span id="st">Checking</span></span>
</nav>
<main>
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h1>Ask your documents</h1>
      <p>Type a question below. Answers come only from the documents uploaded by your admin.</p>
    </div>
  </div>
  <form class="composer" id="f">
    <input type="text" id="q" placeholder="Ask a question" autocomplete="off" autofocus>
    <button class="btn" id="go">Ask</button>
  </form>
</main>
<script>
const $=id=>document.getElementById(id);
fetch('/status').then(r=>r.json()).then(d=>{
  $('dot').className='dot'+(d.ollama_running?' ok':'');
  $('st').textContent=d.ollama_running?'Ready':'Model offline';
}).catch(()=>{$('st').textContent='Server unreachable'});

// saved chat survives page switches
let history=[];
try{history=JSON.parse(sessionStorage.getItem('chat')||'[]')}catch(e){}
const save=()=>{try{sessionStorage.setItem('chat',JSON.stringify(history))}catch(e){}};

function add(cls,text){
  const e=$('empty'); if(e) e.remove();
  const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text;
  $('thread').appendChild(d); d.scrollIntoView({block:'end'}); return d;
}
function addSources(el,names){
  if(!names||!names.length) return;
  const s=document.createElement('div'); s.className='src'; s.append('Sources: ');
  names.forEach(n=>{const c=document.createElement('span');c.className='chip';c.textContent=n;s.append(c)});
  el.append(s);
}

// redraw earlier messages on load
history.forEach(m=>addSources(add(m.cls,m.text),m.names));

$('f').onsubmit=async ev=>{
  ev.preventDefault();
  const q=$('q').value.trim(); if(!q) return;
  $('q').value=''; $('go').disabled=true;
  add('me',q); history.push({cls:'me',text:q}); save();
  const out=add('bot','Searching documents...');
  try{
    const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||'Request failed');
    out.textContent=d.answer;
    const names=[...new Set(d.sources.map(s=>(s.source||'').split(/[\\/]/).pop()).filter(Boolean))];
    addSources(out,names);
    history.push({cls:'bot',text:d.answer,names}); save();
  }catch(err){out.classList.add('err');out.textContent=err.message}
  $('go').disabled=false; $('q').focus(); out.scrollIntoView({block:'end'});
};
</script></body></html>
